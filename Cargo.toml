[workspace]
members = [".", "xtask"]

[package]
name = "fretscope"
version = "0.0.2"
edition = "2021"
authors = ["jsabella"]
description = "Real-time pitch and key detection with guitar fretboard visualization"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "fretscope"
path = "src/main.rs"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
pitch-detection = "0.3"
triple_buffer = "9"
atomic_float = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = false

# baseview before f7326ce ("fix gl context memory leak on linux", RustAudio/baseview#215) never
# destroys its GLX context when the editor closes. On NVIDIA that hangs the next editor's first
# draw, so every FretScope window opened after one is closed stays black. nih-plug pins a
# baseview from before the fix; this moves it six small upstream commits forward to it.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { git = "https://www.github.com/RustAudio/baseview.git", rev = "f7326ce" }
